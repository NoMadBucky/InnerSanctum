  <path fill="#0b2130" fill-rule="evenodd"
        d="M80 87h65c15 0 25 9 25 22 0 8-4 14-11 18 10 4 15 11 15 20 0 14-11 24-28 24H80v-7c6-1 8-4 8-10v-51c0-5-2-8-8-9z
           M109 107v14h34c5 0 8-3 8-7s-3-7-8-7z
           M109 137v15h36c6 0 9-3 9-8s-4-7-9-7z"/>
  <g fill="none" stroke="#fae8c0" stroke-linejoin="round">
    <path stroke-width="2.6" d="M87 92h57c12 0 21 7 21 18 0 8-4 13-12 17 11 4 16 10 16 20 0 11-9 19-24 19H87c6-3 7-7 7-13v-49c0-5-1-9-7-12z"/>
