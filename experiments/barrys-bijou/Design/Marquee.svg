    <path d="M65 44h24v-9h16l12 28H47v-7h57l-3-6H65zm126 0h-24v-9h-16l-12 28h70v-7h-57l3-6h36z"/>
  </g>
  <path fill="#344959" d="M48 67h160v11H48z"/>
  <path fill="#586670" d="M51 68h154v2H51z"/>
