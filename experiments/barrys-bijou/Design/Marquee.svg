<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256">
  <title>Barry’s Bijou — After Hours, Inline</title>
  <defs>
    <linearGradient id="night" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#102d41"/><stop offset=".55" stop-color="#0c2333"/><stop offset="1" stop-color="#081926"/>
    </linearGradient>
    <linearGradient id="brass" x2=".85" y2="1">
      <stop stop-color="#f7d893"/><stop offset=".47" stop-color="#e4b968"/><stop offset="1" stop-color="#bb8941"/>
    </linearGradient>
    <linearGradient id="ivory" x2="0" y2="1">
      <stop stop-color="#fff2ce"/><stop offset="1" stop-color="#f3deb0"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#ffe4a2" stop-opacity=".95"/><stop offset=".45" stop-color="#ffc865" stop-opacity=".4"/>
      <stop offset="1" stop-color="#e6a544" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <path fill="url(#night)" d="M0 0h256v256H0z"/>
  <!-- Recessed doors and fluted pilasters behind the canopy. -->
  <path fill="#091b29" d="M47 195h162v61H47z"/>
  <path fill="#314555" d="M50 197h5v59h-5zm9 0h5v59h-5zm10 0h9v59h-9zm12 0h3v59h-3zm91 0h3v59h-3zm6 0h9v59h-9zm14 0h5v59h-5zm9 0h5v59h-5z"/>
  <path fill="#465868" d="M91 201h74v3H91zm0 9h74v3H91zm4 7h66v39h-4v-35h-26v35h-4v-35H99v35h-4z"/>
